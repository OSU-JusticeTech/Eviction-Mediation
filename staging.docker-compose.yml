services:
  db:
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: '${DB_PASSWORD:?DB_PASSWORD is required}'
      MSSQL_USER: 'mssql'
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          '/opt/mssql-tools/bin/sqlcmd',
          '-S',
          'localhost',
          '-U',
          '${DB_USER:-sa}',
          '-P',
          '${DB_PASSWORD}',
          '-Q',
          'SELECT 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 80s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    image: ${WEB_IMAGE_REF:-eviction-mediation-web-production}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./storage:/rails/storage  # Active Storage uploads (local disk service)
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: web.vars
    environment: &app_env
      RAILS_ENV: production
      REDIS_URL: 'redis://redis:6379/0'
      DB_PASSWORD: '${DB_PASSWORD:?DB_PASSWORD is required}'
      RAILS_MASTER_KEY: '${RAILS_MASTER_KEY:?RAILS_MASTER_KEY is required}'
      APP_URL: '${APP_URL:?APP_URL is required}'
      SMTP_DOMAIN: '${SMTP_DOMAIN:?SMTP_DOMAIN is required}'
      SMTP_USERNAME: '${SMTP_USERNAME:?SMTP_USERNAME is required}'
      SMTP_PASSWORD: '${SMTP_PASSWORD:?SMTP_PASSWORD is required}'

  sidekiq:
    image: ${WEB_IMAGE_REF:-eviction-mediation-web-production}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./storage:/rails/storage
    command: bundle exec sidekiq -C config/sidekiq.yml
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: web.vars
    environment: *app_env

volumes:
  sqlserver_data:
    driver: local
  redis_data:
    driver: local
