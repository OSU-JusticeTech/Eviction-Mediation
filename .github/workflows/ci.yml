name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Security Scan: Ruby
  scan_ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install system dependencies for tiny_tds
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            git \
            pkg-config \
            freetds-dev \
            unixodbc-dev
            
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.4
          bundler-cache: true

      - name: Setup database config
        run: cp config/database.yml.ci config/database.yml
          
      - name: Brakeman Scan
        run: bundle exec brakeman -q --no-exit-on-warn

  # Security Scan: JavaScript (Importmap audit)
  scan_js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install system dependencies for tiny_tds
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            git \
            pkg-config \
            freetds-dev \
            unixodbc-dev
            
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.4
          bundler-cache: true

      - name: Setup database config
        run: cp config/database.yml.ci config/database.yml
          
      - name: Importmap Audit
        run: |
          # Skip importmap audit - not all Rails apps use importmap
          echo "Importmap audit skipped - using custom asset pipeline"

  # Run tests
  test:
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: StrongPassword1
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          tags: eviction-mediation-web-development
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make workspace writable by the container user
        run: |
          sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Start database
        run: docker compose up -d --wait db

      - name: Create and initialize test database
        run: |
          docker compose run --rm -e RAILS_ENV=test web bin/rails db:create
          docker compose cp DBInitTest.sql db:/tmp/DBInitTest.sql
          docker compose exec -T db /opt/mssql-tools/bin/sqlcmd \
            -S localhost -U sa -P "$DB_PASSWORD" -d EVICTION_TEST -i /tmp/DBInitTest.sql
          docker compose run --rm -e RAILS_ENV=test web bin/rails db:migrate

      - name: Start web and browser
        run: docker compose up -d --wait web chrome

      - name: Run tests (unit, integration, system)
        run: |
          docker compose exec -T web sh -lc 'rm -f coverage/.resultset.json coverage/.last_run.json'
          docker compose exec -T -e RAILS_ENV=test web bin/rails test
          docker compose exec -T -e RAILS_ENV=test web bin/rails test test/system
