name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Security Scan: Ruby
  scan_ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install system dependencies for tiny_tds
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            git \
            pkg-config \
            freetds-dev \
            unixodbc-dev
            
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.4
          bundler-cache: true

      - name: Setup database config
        run: cp config/database.yml.ci config/database.yml
          
      - name: Brakeman Scan
        run: bundle exec brakeman -q --no-exit-on-warn

  # Security Scan: JavaScript (Importmap audit)
  scan_js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install system dependencies for tiny_tds
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            git \
            pkg-config \
            freetds-dev \
            unixodbc-dev
            
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.4
          bundler-cache: true

      - name: Setup database config
        run: cp config/database.yml.ci config/database.yml
          
      - name: Importmap Audit
        run: |
          # Skip importmap audit - not all Rails apps use importmap
          echo "Importmap audit skipped - using custom asset pipeline"

  # Run tests
  test:
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: StrongPassword1
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          tags: eviction-mediation-web-development
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make workspace writable by the container user
        run: |
          sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run tests (unit, integration, system)
        run: make test TEST_ALL=false WEB_IMAGE_REF=eviction-mediation-web-development
